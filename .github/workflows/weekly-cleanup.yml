name: Weekly Branch & PR Cleanup

# Läuft jeden Sonntag 03:00 UTC (= 04:00/05:00 CH-Zeit) + manuell triggerbar
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  cleanup:
    name: Stale Branches & gemergte Branches löschen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lösche gemergte Branches (älter als 14 Tage, nicht main)
        run: |
          set -euo pipefail
          echo "════════════════════════════════════════════════════════"
          echo "  🧹 Weekly Cleanup — $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "════════════════════════════════════════════════════════"

          PROTECT_REGEX='^(main|master|develop|staging|production)$'
          CUTOFF=$(date -u -d "-14 days" '+%Y-%m-%d')
          DELETED=0

          git fetch --all --prune
          for branch in $(git branch -r --merged origin/main | grep -v 'HEAD' | sed 's|origin/||' | tr -d ' '); do
            if [[ "$branch" =~ $PROTECT_REGEX ]]; then
              echo "  🔒 protected: $branch"
              continue
            fi
            last=$(git log -1 --format="%cI" "origin/$branch" | cut -c1-10)
            if [[ "$last" < "$CUTOFF" ]]; then
              echo "  🗑  deleting: $branch (last: $last, merged)"
              git push origin --delete "$branch" || echo "    ⚠ push-delete failed for $branch"
              DELETED=$((DELETED + 1))
            else
              echo "  ⏳ keep: $branch (last: $last, too recent)"
            fi
          done

          echo ""
          echo "  ✅ Deleted $DELETED branch(es)"

      - name: Schließe stale PRs (älter als 90 Tage, kein Update)
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-pr-message: |
            ⚠️ Dieser PR ist seit 90 Tagen ohne Update. Er wird in 7 Tagen geschlossen.
            Falls noch relevant: Comment hinzufügen oder Branch updaten.
          close-pr-message: |
            🗑 Auto-geschlossen wegen Inaktivität (90+ Tage).
            Reopen jederzeit möglich.
          days-before-pr-stale: 90
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,wip'
          delete-branch: true

      - name: Schließe stale Issues (älter als 180 Tage, nicht assigned)
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            ⚠️ Dieses Issue ist seit 180 Tagen ohne Update. Es wird in 14 Tagen geschlossen.
          close-issue-message: |
            🗑 Auto-geschlossen wegen Inaktivität.
          days-before-issue-stale: 180
          days-before-issue-close: 14
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,bug,enhancement'

      - name: Summary
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  📅 Nächster Lauf: jeden Sonntag 03:00 UTC"
          echo "  🔧 Manuell triggerbar via GitHub UI → Actions → Weekly Cleanup"
          echo "════════════════════════════════════════════════════════"
