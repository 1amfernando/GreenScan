<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GreenScan Icon-Set</title>
<style>
  :root { --bg:#fbfbf9; --fg:#1e2b1e; --muted:#6b7a6b; --line:#e3e6e1; --accent:#2d8a2d; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:28px 20px 8px; max-width:900px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 18px; color:var(--muted); font-size:13.5px; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:0 20px 18px; max-width:900px; margin:0 auto; }
  .bar label { font-size:13px; color:var(--muted); display:inline-flex; align-items:center; gap:6px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:12px; padding:0 20px 40px; max-width:900px; margin:0 auto; }
  figure { margin:0; padding:16px 8px 10px; border:1px solid var(--line); border-radius:14px; text-align:center; background:#fff; }
  figcaption { margin-top:9px; font-size:11.5px; color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .ico svg { width:var(--size,28px); height:var(--size,28px); color:var(--accent); }
  body.dark { --bg:#111a11; --fg:#e8f0e8; --muted:#93a393; --line:#263326; --accent:#7fd47f; }
  body.dark figure { background:#182318; border-color:#26332a; }
</style></head>
<body>
<header>
  <h1>GreenScan Icon-Set</h1>
  <p class="sub">23 Symbole · 24×24 · Strichstärke 1.75 · <code>currentColor</code>. Alle erben die Textfarbe — deshalb stimmen sie im Hell- und Dunkelmodus ohne Zusatzregeln.</p>
</header>
<div class="bar">
  <label><input type="checkbox" id="dk"> Dunkelmodus</label>
  <label>Größe <input type="range" id="sz" min="16" max="56" value="28"> <span id="szv">28</span> px</label>
  <label>Farbe <input type="color" id="cl" value="#2d8a2d"></label>
</div>
<div class="grid">
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6z"/><path d="M10.5 20a1.8 1.8 0 0 0 3 0"/></svg></div><figcaption>bell</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 1 5.5 18H19v3H5.5A1.5 1.5 0 0 1 4 19.5z"/><path d="M8 7.5h7"/></svg></div><figcaption>book</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.2"/><path d="M3.5 9.8h17M8 3.5v3M16 3.5v3"/></svg></div><figcaption>calendar</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4-3.8 7-8.5 7a10 10 0 0 1-2.6-.34L4 20l1.2-3.4A6.4 6.4 0 0 1 3.5 12c0-4 3.8-7 8.5-7s8.5 3 8.5 7z"/></svg></div><figcaption>chat</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="7.5" r="2.3"/><path d="M16 13.4c2.6.2 4.5 2.2 4.5 5"/></svg></div><figcaption>community</figcaption></figure>

      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10h14l-1.2 9a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 10V7.5a3 3 0 0 1 6 0V10"/></svg></div><figcaption>harvest</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9.3A4.1 4.1 0 0 1 12 8a4.1 4.1 0 0 1 7 2.7c0 4.9-7 9.3-7 9.3z"/></svg></div><figcaption>heart</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V8"/><path d="M12 12c0-3-2.2-5-5-5 0 3 2 5 5 5z"/><path d="M12 9.5c0-3 2.2-5 5-5 0 3-2 5-5 5z"/><path d="M12 16c0-2.4-1.8-4-4-4 0 2.4 1.6 4 4 4z"/></svg></div><figcaption>herb</figcaption></figure>

      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16l-1 11.2a2 2 0 0 1-2 1.8H7a2 2 0 0 1-2-1.8z"/><path d="M8.5 8V6a3.5 3.5 0 0 1 7 0v2"/><path d="M4 8 6 4h12l2 4"/></svg></div><figcaption>market</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11a8.5 6.5 0 0 1 17 0c0 .8-.7 1.4-1.5 1.4h-14C4.2 12.4 3.5 11.8 3.5 11z"/><path d="M10 12.4v5.1a2 2 0 0 0 4 0v-5.1"/><circle cx="9" cy="8.6" r=".9" fill="currentColor" stroke="none"/><circle cx="14.5" cy="9.4" r=".7" fill="currentColor" stroke="none"/></svg></div><figcaption>mushroom</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-6 6.5-10.5a6.5 6.5 0 1 0-13 0C5.5 15 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.4"/></svg></div><figcaption>pin</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c0-3.8 3.4-6.2 7.5-6.2s7.5 2.4 7.5 6.2"/></svg></div><figcaption>profile</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8"/><path d="M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8"/><path d="M21 16v2.5a2.5 2.5 0 0 1-2.5 2.5H16"/><path d="M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16"/><circle cx="12" cy="12" r="3.2"/></svg></div><figcaption>scan</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg></div><figcaption>search</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.2 14.4a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></div><figcaption>settings</figcaption></figure>
      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.4"/><circle cx="17.5" cy="6" r="2.4"/><circle cx="17.5" cy="18" r="2.4"/><path d="m8.2 10.9 7.1-3.7M8.2 13.1l7.1 3.7"/></svg></div><figcaption>share</figcaption></figure>

      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-1 3.5-7 7-7s4 5 8 3.5"/><circle cx="4" cy="18" r="2"/><circle cx="19" cy="14.5" r="2"/></svg></div><figcaption>track</figcaption></figure>

      <figure><div class="ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c3.2 3.7 5.5 6.6 5.5 9.4a5.5 5.5 0 0 1-11 0c0-2.8 2.3-5.7 5.5-9.4z"/></svg></div><figcaption>water</figcaption></figure>
</div>
<script>
  var d=document.getElementById('dk'), s=document.getElementById('sz'), v=document.getElementById('szv'), c=document.getElementById('cl');
  d.addEventListener('change',function(){ document.body.classList.toggle('dark', d.checked); });
  s.addEventListener('input',function(){ v.textContent=s.value; document.documentElement.style.setProperty('--size', s.value+'px'); });
  c.addEventListener('input',function(){ document.querySelectorAll('.ico svg').forEach(function(el){ el.style.color=c.value; }); });
</script>
</body></html>
